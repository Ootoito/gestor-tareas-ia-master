{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Gestor de tareas Olympus</title>
    <link rel="stylesheet" href="{% static 'gestortareas/style_gestor_tareas.css' %}">
</head>
<body class="login-body">

<div class="login-page">

    <div class="login-card">

        <div class="login-brand">
            <div class="login-logo">✓</div>
            <h1>Gestor de tareas Olympus</h1>
            <p>Organiza, analiza y mejora tu productividad con apoyo de IA.</p>
        </div>

        {% if messages %}
            <div class="login-messages">
                {% for message in messages %}
                    <div class="login-message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="login-button">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            Proyecto Final · Máster Programación + IA
        </div>

    </div>

</div>

</body>
</html>
