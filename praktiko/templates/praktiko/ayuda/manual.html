{% extends "praktiko/base.html" %}
{% load i18n %}

{% block title %}
    {% trans "Manual de usuario" %}
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="mb-1">{% trans "Manual de usuario" %}</h1>
            <p class="text-muted mb-0">
                {% trans "Guía básica para empezar a utilizar Praktiko." %}
            </p>
        </div>

        <a href="{% url 'praktiko:home' %}" class="btn btn-outline-secondary">
            {% trans "Volver" %}
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body manual-praktiko">
            {{ contenido_manual|safe }}
        </div>
    </div>

</div>
{% endblock %}
